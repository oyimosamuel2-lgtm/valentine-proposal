<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Will You Be My Valentine? 💌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
      color: #333;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
      padding: 30px;
      max-width: 90%;
      z-index: 10;
    }

    h1 {
      font-size: clamp(2.1rem, 6vw, 3.8rem);
      margin-bottom: 1.2rem;
      color: #fff;
      text-shadow: 0 4px 15px rgba(0,0,0,0.25);
      font-weight: 700;
    }

    h1 span {
      color: #ff4757;
    }

    .subtitle {
      font-size: clamp(1.1rem, 4vw, 1.5rem);
      margin-bottom: 2.5rem;
      color: #fff;
      opacity: 0.95;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      flex-wrap: wrap;
      position: relative;
    }

    button {
      font-family: inherit;
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      font-weight: 600;
      padding: 0.9rem 2.4rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 25px rgba(0,0,0,0.18);
    }

    #yesBtn {
      background: #ff4757;
      color: white;
    }

    #yesBtn:hover {
      background: #e84118;
      transform: translateY(-4px) scale(1.08);
      box-shadow: 0 12px 35px rgba(232,65,24,0.4);
    }

    #noBtn {
      background: #2f3542;
      color: #dfe4ea;
      position: relative;
      user-select: none;
    }

    #noBtn:hover {
      background: #1e272e;
    }

    .balloon {
      position: absolute;
      width: 80px;
      height: 100px;
      background: radial-gradient(circle at 30% 30%, #fff, transparent 60%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      pointer-events: none;
      opacity: 0;
      transform: translateY(100vh);
      animation: float 8s forwards;
      box-shadow: inset -10px -10px 30px rgba(0,0,0,0.15);
    }

    .balloon::after {
      content: "";
      position: absolute;
      width: 2px;
      height: 120px;
      background: rgba(0,0,0,0.25);
      bottom: -120px;
      left: 50%;
      transform: translateX(-50%);
    }

    @keyframes float {
      0%   { transform: translateY(120vh) scale(0.6); opacity: 0.7; }
      10%  { opacity: 1; }
      100% { transform: translateY(-150vh) scale(1.1); opacity: 0; }
    }

    .heart {
      color: #ff4757;
      font-size: 1.4em;
      margin: 0 6px;
    }

    @media (max-width: 500px) {
      .buttons {
        flex-direction: column;
        gap: 1.8rem;
      }
      button {
        padding: 1rem 3rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Hey there!<br>Will you be my<br><span>Valentine</span> <span class="heart">❤️</span>?</h1>
    <p class="subtitle">From your friend, <strong>Samuel</strong></p>

    <div class="buttons">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No 😕</button>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn  = document.getElementById('noBtn');

    // Yes → celebration
    yesBtn.addEventListener('click', () => {
      document.body.style.background = "linear-gradient(135deg, #f093fb 0%, #f5576c 100%)";
      
      // Confetti / balloons
      for(let i = 0; i < 40; i++) {
        setTimeout(() => {
          createBalloon();
        }, i * 120);
      }

      // Change text
      document.querySelector('h1').innerHTML = 
        "YAAAY!!! 🎉<br>I'm the happiest person today!<br>Thank youuu 💕";

      document.querySelector('.subtitle').innerHTML = 
        "Samuel is already planning the best date ever 😍";

      // Disable both buttons
      yesBtn.disabled = true;
      noBtn.style.display = "none";
    });

    // No → run away (with some randomness)
    noBtn.addEventListener('mouseover', (e) => {
      const btn = e.target;
      const maxX = window.innerWidth - btn.offsetWidth - 40;
      const maxY = window.innerHeight - btn.offsetHeight - 40;

      const newX = Math.random() * maxX;
      const newY = Math.random() * maxY;

      btn.style.position = 'fixed';
      btn.style.left = newX + 'px';
      btn.style.top  = newY + 'px';
      btn.style.transition = 'all 0.4s ease-out';
    });

    // Also run when trying to click
    noBtn.addEventListener('click', (e) => {
      e.preventDefault();
      noBtn.style.transform = 'scale(1.3)';
      setTimeout(() => {
        noBtn.style.transform = 'scale(1)';
      }, 200);
    });

    function createBalloon() {
      const balloon = document.createElement('div');
      balloon.className = 'balloon';
      
      // Random color & position
      const colors = ['#ff6b6b','#4ecdc4','#45b7d1','#96c93d','#feca57','#ff9ff3','#ff4757','#1e90ff'];
      balloon.style.background = colors[Math.floor(Math.random()*colors.length)];
      balloon.style.left = Math.random() * 100 + 'vw';
      balloon.style.animationDuration = (6 + Math.random()*5) + 's';
      
      document.body.appendChild(balloon);

      setTimeout(() => {
        balloon.remove();
      }, 12000);
    }
  </script>
</body>
</html>
